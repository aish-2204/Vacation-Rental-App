[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vacation-rental-backend"
version = "0.1.0"
description = "Local FastAPI foundation for the Vacation Rental application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.121.3",
    "pydantic-settings==2.12.0",
    "sqlalchemy[asyncio]==2.0.44",
    "asyncpg==0.30.0",
    "alembic==1.17.2",
    "bcrypt==5.0.0",
    "PyJWT==2.15.1",
    "email-validator==2.4.0",
    "tzdata==2026.6",
    "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "ruff==0.14.5",
]
# Only needed when STORAGE_PROVIDER=azure.
azure = [
    "azure-storage-blob==12.27.1",
    "aiohttp==3.14.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "seed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
